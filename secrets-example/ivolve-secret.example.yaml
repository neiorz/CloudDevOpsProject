# Example only. Never put real values in Git.
# The real Secret is created from the local .env file:
#   kubectl -n ivolve create secret generic ivolve-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD=... \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=SESSION_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: ivolve-secret
  namespace: ivolve
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root
  DB_PASSWORD: change-me-db
  SESSION_SECRET: change-me-session
