---
- name: Install Docker Engine and CLI
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true

- name: Add ubuntu and jenkins users to docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop:
    - ubuntu
    - jenkins
  notify: Restart docker

- name: Ensure Docker service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
