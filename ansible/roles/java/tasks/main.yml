---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install OpenJDK 21 JRE and base utilities
  become: true
  ansible.builtin.apt:
    name:
      - fontconfig
      - openjdk-21-jre
      - curl
      - ca-certificates
      - gnupg
      - unzip
    state: present
