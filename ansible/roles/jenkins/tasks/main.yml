---
- name: Download Jenkins GPG key (2026)
  become: true
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /tmp/jenkins.io-2026.key
    mode: "0644"

- name: Dearmor Jenkins GPG key into /usr/share/keyrings
  become: true
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/jenkins-keyring.gpg /tmp/jenkins.io-2026.key
    creates: /usr/share/keyrings/jenkins-keyring.gpg

- name: Add Jenkins apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Install Jenkins
  become: true
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Ensure Jenkins service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: true
